servicenow:
  instance_url: "${SNOW_INSTANCE_URL}"
  api_user: "${SNOW_API_USER}"
  api_password: "${SNOW_API_PASSWORD}"
  timeout: 30
  verify_ssl: true

patterns:
  repository: "./patterns"
  auto_reload: true
  cache_ttl: 3600

validation:
  severity_levels:
    - critical
    - high
    - medium
    - low
  fail_on_critical: true
  parallel_execution: true
  max_workers: 4

terraform:
  parse_timeout: 300
  max_file_size_mb: 50
  supported_versions:
    - "1.0"
    - "1.1"
    - "1.2"
    - "1.3"
    - "1.4"
    - "1.5"
    - "1.6"

approval:
  routing:
    fast_track_threshold: 0.95
    standard_review_threshold: 0.85
    full_review_threshold: 0.0

reporting:
  output_formats:
    - json
    - html
    - pdf
  include_diagrams: true

database:
  url: "${DATABASE_URL}"
  pool_size: 5
  echo: false
